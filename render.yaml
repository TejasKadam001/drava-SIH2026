# Render blueprint: inference service (native Python) + API gateway (Docker).
services:
  - type: web
    name: drava-ml-service
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r twin_api/requirements.txt
    startCommand: uvicorn twin_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

  - type: web
    name: drava-backend
    env: docker
    dockerfilePath: deploy/Dockerfile.gateway
    dockerContext: .
    region: oregon
    plan: free
    branch: main
    envVars:
      - key: ML_SERVICE_URL
        value: https://drava-ml-service.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: local
