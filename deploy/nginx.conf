# Drava console gateway: static bundle + reverse proxy to the API tiers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Single-page app: unknown paths fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot gateway.
    location /gw/ {
        proxy_pass         http://springboot:8080/gw/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Inference service: REST plus the telemetry stream (WebSocket upgrade).
    location /v1/ {
        proxy_pass         http://ml-service:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}
