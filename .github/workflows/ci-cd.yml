name: Drava CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: drava-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "21"

jobs:
  console:
    name: Operator console (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - name: Type-check and bundle
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: console-bundle
          path: frontend/dist
          retention-days: 7

  inference:
    name: Inference service (FastAPI + physics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: twin_api/requirements.txt
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r twin_api/requirements.txt
      - name: Physics and ML test suite
        run: python scripts/check_all.py
      - name: Health endpoint smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from twin_api.main import app

          reply = TestClient(app).get("/v1/status")
          assert reply.status_code == 200, reply.text
          print("GET /v1/status -> 200")
          PY

  gateway:
    name: API gateway (Spring Boot / Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build and test
        run: mvn -B clean test

  images:
    name: Container image build check
    runs-on: ubuntu-latest
    needs: [console, inference, gateway]
    strategy:
      matrix:
        dockerfile: [Dockerfile.inference, Dockerfile.gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.dockerfile }}
          push: false
          load: false

  release-note:
    name: Deploy hook
    runs-on: ubuntu-latest
    needs: [images]
    if: github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Summary
        run: echo "All Drava checks passed on main."
      - name: Ping Render deploy hook (only if configured)
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
