services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: drava-postgres
    environment:
      POSTGRES_DB: drava
      POSTGRES_USER: drava_user
      POSTGRES_PASSWORD: drava_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./gateway/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drava_user -d drava"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile.inference
    container_name: drava-ml-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/v1/status\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  springboot:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    container_name: drava-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/drava
      - SPRING_DATASOURCE_USERNAME=drava_user
      - SPRING_DATASOURCE_PASSWORD=drava_dev_pw
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.console
    container_name: drava-frontend
    ports:
      - "3000:3000"
    depends_on:
      - springboot
      - ml-service
    restart: unless-stopped

volumes:
  pgdata:
